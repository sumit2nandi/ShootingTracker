<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ShootingTracker</title>
  <link rel="stylesheet" href="css/app.css?v=4" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4" />
  <link rel="apple-touch-icon" href="favicon.png?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </span>
      <span class="brand-name">ShootingTracker</span>
    </div>
    <nav class="desktop-tabs" aria-label="Main">
      <button class="tab active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="1.5"/><rect x="13.5" y="12" width="7.5" height="9" rx="1.5"/><rect x="3" y="15.5" width="7.5" height="5.5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="tab" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
        <span>Calendar</span>
      </button>
      <button class="tab" data-view="shoots">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>Shoots</span>
      </button>
    </nav>
    <div class="top-right">
      <span id="db-status" class="db-pill" title="Checking database…">
        <span class="dot"></span><span class="db-pill-text">DB…</span>
      </span>
      <button id="btn-export" class="btn btn-ghost" aria-label="Export all data" title="Export all shoots (original calendar CSV format)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        <span class="btn-label">Export</span>
      </button>
      <button id="btn-new-shoot" class="btn btn-primary" aria-label="New shoot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-label">New shoot</span>
      </button>
    </div>
  </header>

  <section id="filterbar" class="filterbar" data-for="dashboard">
    <div class="filter-group"><label>Month</label><select id="f-month"></select></div>
    <div class="filter-group"><label>Coordinator</label><select id="f-coordinator"></select></div>
    <div class="filter-group extra"><label>Client</label><select id="f-client"></select></div>
    <div class="filter-group extra"><label>Status</label><select id="f-status"></select></div>
    <div class="filter-group extra"><label>Type</label><select id="f-type"></select></div>
    <div class="filter-group grow extra"><label>Search</label><input id="f-q" type="search" placeholder="Search shoots…" /></div>
    <button id="f-clear" class="btn btn-ghost">Clear</button>
  </section>

  <main id="main">
    <section id="view-dashboard" class="view">
      <div class="card">
        <div class="card-head"><h3>Upcoming shoots</h3></div>
        <div id="upcoming-table" class="table-wrap"></div>
      </div>
      <div id="kpi-row" class="kpi-row"></div>
      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3 id="chart-title">Earnings by month</h3><span class="muted" id="chart-range"></span></div>
          <div id="chart-monthly" class="chart-area"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Shoots by status</h3></div>
          <div id="chart-status" class="donut-wrap"></div>
        </div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-head"><h3>By coordinator</h3></div>
          <div id="list-coordinators"></div>
        </div>
      <div class="card">
        <div class="card-head"><h3>By shoot type</h3></div>
        <div id="list-types" class="type-chips"></div>
      </div>
      </div>
    </section>

    <section id="view-calendar" class="view hidden">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn icon-btn" id="cal-prev" aria-label="Previous month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <select id="cal-month" class="cal-select" aria-label="Month"></select>
          <select id="cal-year" class="cal-select" aria-label="Year"></select>
          <button class="btn icon-btn" id="cal-next" aria-label="Next month">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="btn btn-ghost" id="cal-today">Today</button>
        </div>
        <div class="cal-legend" id="cal-legend"></div>
      </div>
      <div class="cal-head-row">
        <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div><div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="cal-mobile-note muted small">Tap a day to add a shoot · tap a shoot to open it</div>
    </section>

    <section id="view-shoots" class="view hidden">
      <div class="card">
        <div class="card-head">
          <h3>All shoots</h3>
          <span class="muted" id="shoots-count"></span>
        </div>
        <div id="shoots-table" class="table-wrap"></div>
      </div>
    </section>
  </main>

  <!-- shoot form modal -->
  <div class="modal-backdrop hidden" id="shoot-modal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="shoot-modal-title">New shoot</h3>
        <button class="icon-btn btn btn-ghost" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="shoot-form" class="form-grid">
        <input type="hidden" name="id" />
        <!-- core fields -->
        <div class="field span-2"><label>Title *</label><input name="title" required placeholder="e.g. Ananya & Vikram — Wedding" /></div>
        <div class="field"><label>Shoot date *</label><input name="shoot_date" type="date" required /></div>
        <div class="field"><label>Fee (₹)</label><input name="fee" type="number" min="0" step="0.01" inputmode="numeric" value="0" /></div>
        <div class="field"><label>Coordinator</label>
          <select name="coordinator" id="sel-coordinator">
            <option value="">— none —</option>
            <option value="__new__">➕ New coordinator…</option>
          </select>
          <input name="coordinator_new" id="coord-new-input" placeholder="Type new coordinator name" hidden />
        </div>
        <div class="field"><label>Status</label>
          <select name="status" id="sel-status">
            <option value="planned">Planned</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <!-- details -->
        <details class="field span-2 more-details">
          <summary>More details</summary>
          <div class="sub-grid">
            <div class="field"><label>Client</label><input name="client_name" list="dl-clients" placeholder="Client name" /></div>
            <div class="field"><label>Type</label><input name="shoot_type" list="dl-types" placeholder="wedding, fashion…" /></div>
            <div class="field"><label>End date</label><input name="end_date" type="date" /></div>
            <div class="field"><label>Start time</label><input name="start_time" type="time" /></div>
            <div class="field"><label>End time</label><input name="end_time" type="time" /></div>
            <div class="field"><label>Venue</label><input name="venue" placeholder="Hall / studio" /></div>
            <div class="field"><label>Location</label><input name="location" placeholder="City / area" /></div>
            <div class="field"><label>Contact name</label><input name="contact_name" /></div>
            <div class="field"><label>Contact phone</label><input name="contact_phone" inputmode="tel" /></div>
            <div class="field span-2"><label>Notes</label><textarea name="notes" rows="3"></textarea></div>
          </div>
        </details>
      </form>
      <datalist id="dl-coordinators"></datalist>
      <datalist id="dl-clients"></datalist>
      <datalist id="dl-types"></datalist>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button class="btn btn-primary" id="btn-save-shoot">Save shoot</button>
      </div>
    </div>
  </div>

  <!-- detail drawer -->
  <div class="drawer-backdrop hidden" id="drawer-backdrop">
    <aside class="drawer" id="drawer"></aside>
  </div>

  <!-- floating bottom tab bar (liquid glass) -->
  <nav class="tabbar" id="tabs" aria-label="Main">
    <button class="tab active" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="1.5"/><rect x="13.5" y="12" width="7.5" height="9" rx="1.5"/><rect x="3" y="15.5" width="7.5" height="5.5" rx="1.5"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="tab" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
      <span>Calendar</span>
    </button>
    <button class="tab" data-view="shoots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>Shoots</span>
    </button>
  </nav>

  <div id="toasts" class="toasts"></div>

  <script src="js/app.js?v=3"></script>
</body>
</html>
